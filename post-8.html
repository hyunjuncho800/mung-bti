                <h1>First Vaccination Schedule and Essential Vaccine Guide for Beginner Dog Owners</h1>
                <h2>Introduction: Basic vaccinations that determine lifelong health</h2><p>After welcoming a puppy into the family, the first essential item to take care of is 'basic vaccinations'. The immunity (maternally transmitted antibodies) inherited from the mother dog gradually begins to decline after 6 to 8 weeks of age, making the dog extremely vulnerable to external viral infections. We will summarize the types of basic vaccines and vaccination schedules by period that you must know to protect your young puppy's life from scary infectious diseases such as parvovirus and distemper (measles), which have high fatality rates.</p><h2>Body 1: Types of essential vaccinations (what should you get?)</h2><p>There are four basic vaccinations recommended by veterinary hospitals in Korea.</p><ul><li><strong>Comprehensive vaccines. (DHPPL):</strong> It is a core vaccine that prevents five deadly diseases at once, including Distemper, Infectious Hepatitis, Parvovirus, Parainfluenza, and Leptospirosis.</li><li><strong>Corona Enteritis Vaccine:</strong> Prevents enteritis caused by the coronavirus. It causes severe vomiting, diarrhea, and bloody stool and is highly contagious.</li><li><strong>Kennel Cough Vaccine:</strong> Prevents infectious bronchitis (respiratory disease). It is easily infected through the air in places where dogs are crowded, such as dog cafes, grooming salons, and dog hotels.</li><li><strong>Rabies vaccine:</strong> It is a statutory infectious disease that can infect all warm-blooded animals and humans, so vaccination is mandatory after 3 months of age.</li></ul><h2>Main topic 2: 5th schedule and precautions starting at 6 weeks of age</h2><p>Generally, a total of 2 to 3 weeks apart Vaccination is administered in 5 doses.</p><p>??<strong>1st vaccination (6-8 weeks after birth):</strong> 1st comprehensive vaccine + 1st dose for Corona enteritis<br>??<strong>2nd dose (8-10 weeks after birth):</strong> 2nd dose of comprehensive vaccine + 2nd dose for Corona enteritis<br>??<strong>3rd vaccination (10-12 weeks after birth):</strong> 3rd dose of comprehensive vaccine + 1st dose of kennel cough<br>??<strong>4th dose (12-14 weeks after birth):</strong> 4th dose of comprehensive vaccine + 2nd dose of kennel cough<br>??<strong>5th dose (14-16 weeks of age):</strong> 5th dose of comprehensive vaccine + influenza (optional) + rabies</p><p>Approximately 2 weeks after the 5th dose, You must draw blood and conduct an 'antibody test' to check whether sufficient antibodies have been formed. If a specific antibody is lacking, additional vaccination may be necessary.</p><h2>Conclusion: Physical condition management that the guardian should take care of on the day of vaccination</h2><p>The vaccine is based on the principle of creating immunity by injecting a small amount of virus into the body, so the dog's physical condition may deteriorate. On the day of vaccination, please refrain from bathing or taking excessive walks and rest in a warm, quiet place. In rare cases, anaphylactic shock (allergic reaction) such as facial swelling, severe vomiting, and difficulty breathing may occur, so you should carefully observe your child's condition for 2 to 3 hours after vaccination.</p>
