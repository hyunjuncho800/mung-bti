                <h1>Analysis of the causes of dog tear stains and ways to improve diet to prevent dermatitis around the eyes</h1>
                <h2>Introduction: The nuisance of white dogs, the identity of red tear stains</h2><p>The most concerning thing for families with bright-haired dogs such as Maltese, Bichon Frize, and Poodles is the phenomenon of red staining around the eyes, also known as 'tear stains (galactorrhea). Not only does it look messy, but if the fur is always wet due to tears, bacteria can multiply, causing serious dermatitis and bad odor. No matter how expensive a tear eraser you buy and wipe away, we will find out the real cause of tear stains that constantly recur if you do not address the root cause, and how to improve your diet.</p><h2>Main topic 1: Porphyrin, the scientific cause of tears turning red</h2><p>A dog's tears, saliva, and urine contain an iron-containing molecule called 'porphyrin'. When tears cannot be discharged normally through the tear duct into the nose and overflow, the porphyrin component reacts with oxygen and sunlight and oxidizes to red or reddish brown. Causes of excessive tearing can be broadly divided into three categories.</p><ul><li><strong>Structural problems:</strong> Brachycephalic species with a short nose bridge or congenital narrow or blocked tear ducts.</li><li><strong>Physical irritation:</strong> Eye diseases such as keratitis, conjunctivitis, and eyelashes that prick the eyeball.</li><li><strong>Dietary allergies:</strong> To certain protein ingredients in feed or snacks. When the body triggers an immune response, causing inflammation and secreting excessive tears. </li></ul><h2>Main topic 2: Catch your allergies! Restricted Feeding and Elimination Diet</h2><p>Unless a structural or eye disease is found as a result of a hospital examination, 'dietary allergy' is most likely the cause. The most effective way to deal with this is to completely replace the main protein source of the food.</p><p>Most dog foods are made from chicken or beef, and many children are allergic to these ingredients. Try replacing the protein source you were previously feeding with a feed that contains novel protein ingredients that you have not encountered before, such as<strong>salmon, duck, turkey, kangaroo meat, and insect protein</strong>. Alternatively, try feeding <strong>hydrolyzed feed</strong>, which has protein particles broken down into smaller pieces so that the immune system does not recognize them as allergens, for at least 6 to 8 weeks. During this period, you should stop eating any snacks, such as gum or beef jerky, to find out exactly what ingredients are causing the tears.</p><h2>Conclusion: Keeping a food diary that requires patience</h2><p>Resolving tear stains does not happen overnight. Considering the hair growth cycle, it takes at least two months after changing the feed to see the effect of the red marks fading. Record the food and snacks your child eats every day, as well as the amount of tears that day, in a 'food diary' on the calendar. If you make an effort to cut the hair around the eyes short on a regular basis to prevent them from piercing the eyes, and immediately wipe away excess tears with saline solution or a cotton pad, you will be able to regain the white and clear face of a child.</p>
