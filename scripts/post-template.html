<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE_KO}} | 댕댕이 팁</title>
    <meta name="description" content="{{EXCERPT_KO}}">
    
    <!-- Open Graph -->
    <meta property="og:title" content="{{TITLE_KO}} | 댕댕이 팁">
    <meta property="og:description" content="{{EXCERPT_KO}}">
    <meta property="og:image" content="https://hyunjuncho800.github.io/mung-bti/share_thumbnail.jpg">
    <meta property="og:type" content="article">

    <link rel="canonical" href="https://mung-test.com/post-{{POST_ID}}.html">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css?v=2">
    <script src="i18n.js?v=2"></script>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <style>
        .post-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 40px;
            background: var(--bg);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }
        
        .blog-article h1 {
            font-size: 2rem;
            color: var(--primary-dark);
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
            line-height: 1.3;
        }

        .blog-article h2 {
            font-size: 1.4rem;
            color: var(--text);
            margin-top: 30px;
            margin-bottom: 16px;
        }

        .blog-article p {
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--text);
            margin-bottom: 16px;
        }

        .blog-article ul {
            margin-bottom: 16px;
            padding-left: 20px;
        }

        .blog-article li {
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--text);
            margin-bottom: 8px;
        }

        .back-to-blog {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--primary);
            font-weight: bold;
            text-decoration: none;
        }
        .back-to-blog:hover {
            text-decoration: underline;
        }

        /* Language switching CSS */
        html[lang="en"] .lang-ko { display: none !important; }
        html[lang="en"] .lang-en { display: block !important; }
        html[lang="ko"] .lang-en { display: none !important; }
        html[lang="ko"] .lang-ko { display: block !important; }
        
        /* By default if no lang attribute, show KO and hide EN */
        .lang-en { display: none; }
        .lang-ko { display: block; }
        
        @media(max-width: 600px) {
            .post-container {
                padding: 20px;
                margin: 20px;
                border-radius: 12px;
            }
            .blog-article h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <a href="index.html" class="logo" data-i18n="nav_blog" style="color: var(--primary);">🐾 댕댕이 팁(Blog)</a>
        <button class="menu-toggle" aria-label="메뉴 열기">☰</button>
        <nav>
            <ul>
                <li><a href="index.html" data-i18n="nav_home">홈</a></li>
                <li><a href="mung-test.html" data-i18n="nav_start">반려견 기질 검사</a></li>
                <li><a href="blog.html" style="font-weight:bold; color:var(--primary);" data-i18n="nav_blog">댕댕이 팁(Blog)</a></li>
                <li><a href="food-guide.html" data-i18n="nav_food">음식 가이드</a></li>
                <li><a href="age-calculator.html" data-i18n="nav_age">나이 계산기</a></li>
                <li><a href="size-calculator.html" data-i18n="nav_size">의류 사이즈 추천기</a></li>
                <li><a href="breeds.html" data-i18n="nav_breeds">견종 백과사전</a></li>
                <li><a href="diagnostics.html" data-i18n="nav_diagnostics">자가진단 가이드</a></li>
                <li><a href="travel.html" data-i18n="nav_travel">여행 가이드</a></li>
            </ul>
        </nav>
        <div class="header-actions">
            <button id="btn-lang" class="header-btn" aria-label="언어 변경">EN</button>
            <button id="btn-theme" class="header-btn" aria-label="테마 변경">🌙</button>
        </div>
    </div>
</header>

<main class="container">
    <div class="post-container">
        <a href="blog.html" class="back-to-blog" data-i18n="back_to_blog">← 목록으로 돌아가기</a>
        <article class="blog-article">
            <!-- Korean Content -->
            <div class="lang-ko">
                <h1>{{TITLE_KO}}</h1>
                {{CONTENT_KO}}
                {{CTA_KO}}
            </div>
            
            <!-- English Content -->
            <div class="lang-en">
                <h1>{{TITLE_EN}}</h1>
                {{CONTENT_EN}}
                {{CTA_EN}}
            </div>
        </article>
    </div>
</main>

<footer class="site-footer" style="background-color: #f8f9fa; padding: 30px 20px; text-align: center; border-top: 1px solid #e9ecef; margin-top: 40px;">
    <p style="font-size: 0.8rem; color:var(--text-muted); margin: 0;">&copy; 2026 mung-test.com. All rights reserved.</p>
</footer>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        // Init theme and lang from i18n.js
        const lang = getLang();
        applyLanguage(lang);
    });
</script>
</body>
</html>
